<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jo 的旅行笔记</title>
<style>
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --ink:#16233B; --muted:#5B677A; --line:#D3DAE2;
  --me:#16233B; --me-ink:#FFFFFF; --friend:#E3A22F; --friend-ink:#2A1D03; --link:#2E6B5C; --chip:#E1E8ED;
  --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","STSong","SimSun",serif;
  --sans:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1626; --surface:#17213A; --ink:#E8EDF5; --muted:#9AA7BC; --line:#2A3652;
    --me:#7FA6F5; --me-ink:#0B1226; --friend:#E9B04B; --friend-ink:#241A04; --link:#7CC4AE; --chip:#222E4A;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1626; --surface:#17213A; --ink:#E8EDF5; --muted:#9AA7BC; --line:#2A3652;
  --me:#7FA6F5; --me-ink:#0B1226; --friend:#E9B04B; --friend-ink:#241A04; --link:#7CC4AE; --chip:#222E4A;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--link);text-underline-offset:3px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--friend);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}
header.hero{padding:56px 0 28px}
h1{font:700 clamp(34px,8vw,60px)/1.15 var(--serif);margin:0 0 12px;letter-spacing:.02em}
.lede{color:var(--muted);margin:0;max-width:34em}
nav.top{display:flex;gap:18px;flex-wrap:wrap;margin-top:20px;font-size:15px}


.places{list-style:none;margin:32px 0 0;padding:0;border-top:1px solid var(--line)}
.places a.row{display:grid;grid-template-columns:1fr auto;gap:4px 20px;padding:22px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.places a.row:hover .city{text-decoration:underline;text-underline-offset:6px}
.city{font:700 clamp(30px,7vw,46px)/1.2 var(--serif)}
.native{font:400 clamp(18px,4vw,24px)/1.4 var(--sans);color:var(--muted);margin-left:12px}
.when{color:var(--muted);font-size:15px;align-self:end;text-align:right;white-space:nowrap}
.blurb{grid-column:1/-1;color:var(--muted);margin:0;font-size:15px}
.state{display:inline-block;font-size:12px;background:var(--chip);border-radius:4px;padding:0 6px;margin-left:8px;vertical-align:3px;font-family:var(--sans);font-weight:400}
.state.on{background:var(--friend);color:var(--friend-ink)}
@media (max-width:560px){.places a.row{grid-template-columns:1fr}.when{text-align:left}}
footer{padding:40px 0 60px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
  <h1>Jo 的旅行笔记</h1>
  <p class="lede">去过的和准备去的地方，每个城市一页：行程、航班、地图和吃饭的店。</p>
</header>

<ul class="places">
  <li><a class="row" href="seoul/index.html">
    <span class="city">首尔<span class="native">서울</span><span class="state on">已规划</span></span>
    <span class="when">2026年11月27日至12月1日</span>
    <p class="blurb">四天，主要是吃。弘大、广藏市场、圣水、狎鸥亭、清潭洞，75 家餐厅清单。</p>
  </a></li>
  <li><a class="row" href="chiangmai/index.html">
    <span class="city">清迈<span class="native">เชียงใหม่</span><span class="state">规划中</span></span>
    <span class="when">日期待定</span>
    <p class="blurb">还在收集想去的地方。</p>
  </a></li>
</ul>

<footer>最后更新 2026年11月26日。</footer>
</div>
</body>
</html>
